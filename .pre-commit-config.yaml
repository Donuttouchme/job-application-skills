default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check

  - repo: local
    hooks:
      - id: personal-data-guard
        name: personal data guard
        entry: python tools/personal_data_guard.py
        language: python
        stages: [pre-commit]
      - id: unit-tests
        name: unit tests
        entry: >-
          python -c "import subprocess, sys; sys.exit(max(subprocess.call([sys.executable, '-m', 'unittest', 'discover', '-s', directory, '-v']) for directory in ('skills/motivational-letter/scripts/tests', 'tools/tests')))"
        language: system
        stages: [pre-push]
        files: '(\.py$|^skills/motivational-letter/scripts/)'
        pass_filenames: false
